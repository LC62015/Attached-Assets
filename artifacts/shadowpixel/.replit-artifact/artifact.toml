kind = "web"
previewPath = "/"
title = "ShadowPixel Studios"
version = "1.0.0"
id = "artifacts/shadowpixel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19191

[services.development]
run = "pnpm --filter @workspace/shadowpixel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shadowpixel", "run", "build" ]
publicDir = "artifacts/shadowpixel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19191"
BASE_PATH = "/"
